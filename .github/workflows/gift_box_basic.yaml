name: gift_box_basic

on:
  push:
    paths:
      - 'gift_box/examples/basic/**'
      - 'gift_box/pubspec.yaml'
      - 'gift_box/pubspec.lock'
      - '.github/workflows/gift_box_basic.yaml'
      - 'mise.toml'
      - 'mise.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gift_box/examples/basic

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.14'
          install_args: 'flutter'

      - name: Cache flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            ./gift_box/.dart_tool
          key: ${{ runner.os }}-flutter-gift-box-basic-${{ hashFiles('./gift_box/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-gift-box-basic-
      - name: Install dependencies
        working-directory: ./gift_box
        run: flutter pub get --enforce-lockfile

      - name: Format code
        run: dart format --set-exit-if-changed .
      - name: Analyze code
        run: flutter analyze
      - name: Run code metrics
        run: dart run dart_code_linter:metrics analyze . --set-exit-on-violation-level=warning
      - name: Run tests
        run: flutter test --test-randomize-ordering-seed=random

name: gift_keys
description: A new Flutter project.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2


  # Local storage
  sqlite_async: ^0.14.0
  sqlite3: ^3.9.2

  # Navigator
  go_router: ^18.1.4

  # State Management
  bloc_concurrency: ^0.3.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # UI
  dynamic_color: ^2.1.0
  material_ui: ^1.11.1
  rive: ^0.14.0-dev.12

  # Utils
  clock: ^1.1.2
  collection: ^1.19.1
  equatable: ^3.0.0
  file: ^7.0.1
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.0
  get_it: 9.3.0
  logger: ^2.6.2
  nfc_manager:
    git:
      url: https://github.com/ngoc-quoc-huynh/nfc_manager.git
      path: nfc_manager
      ref: v2.0.0
  package_info_plus: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  # Linter
  cosee_lints: 0.16.0
  dart_code_linter: ^4.0.0

  # Localization
  slang_flutter: ^4.9.0
  slang_build_runner: ^4.9.0

  # Launcher icon
  flutter_launcher_icons: ^0.14.4

  # Splash Screen
  flutter_native_splash: ^2.4.7

  # Test
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  meta: ^1.16.0
  mocktail: ^1.0.4
  test_cov_console: ^0.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/key.riv
    - assets/launcher_icon.webp
